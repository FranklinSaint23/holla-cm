name: holla_client_app
description: HOLLA — Intelligent Urban Delivery
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.0
  flutter_localizations:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0

  # Maps — OpenStreetMap gratuit
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Storage local
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # HTTP (pour FastAPI IA)
  dio: ^5.4.3+1

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0
  timeago: ^3.6.1
  url_launcher: ^6.3.0

  # Notifications
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.1.2

  # Image
  image_picker: ^1.1.1

  # Icons
  cupertino_icons: ^1.0.6
  ionicons: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.10
  # On place l'outil de génération des icônes dans les dépendances de développement
  flutter_launcher_icons: ^0.13.1

# Configuration globale pour le générateur d'icônes (aligné tout à gauche !)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700